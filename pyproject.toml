[project]
name = "trace"
version = "0.1.0"
description = "TRACE: tracking recordings via aircraft curve estimation"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "argon2-cffi>=25.1.0",
    "dopplertrack",
    "fastapi>=0.165.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "backend"

[tool.uv.sources]
dopplertrack = { git = "https://github.com/mjshiggins/dopplertrack", rev = "2d899bbfe1529e2b4351f328969bb37776d57cb4" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-m 'not reference' -ra"
markers = [
    "slow: takes about a minute or more",
    "reference: needs the Oyster Bay reference data and several minutes; run with -m reference",
]
