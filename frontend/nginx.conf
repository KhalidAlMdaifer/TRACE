server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sent with every page and API answer. Scripts and requests only from here; images also
    # from https hosts, for the map tiles; styles inline, because the interface sets them so.
    include /etc/nginx/trace-headers.conf;

    # recordings can be large: MAX_UPLOAD_MB in the api is the real limit
    client_max_body_size 2100m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the visitor's address as this server sees it; a list sent by the visitor is not passed on
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # the event stream must not be buffered, and a search can run for a long time
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    # /cases/<id> and the like are pages of the one-page app
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/trace-headers.conf;      # a location with its own add_header inherits none
    }
}
